<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | StockFlow Electronics</title><meta name="description" content="StockFlow: inventory management built for electronics retailers and distributors."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔌%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="/site.css"></head><body>
<header><nav><a class="logo" href="/">🔌 StockFlow</a><a class="l" href="/">Home</a><a class="l" href="/about">About</a><a class="l on" href="/contact">Contact</a><a class="btn" href="/app">Sign in / Register</a></nav></header>
<main><h2>Contact us</h2><p class="sub">Questions or feedback? Send us a message and we will reply by email.</p>
<form class="c" id="cf"><input id="n" placeholder="Your name" required minlength="2" maxlength="100"><input id="e" type="email" placeholder="Email address" required maxlength="190"><textarea id="m" rows="5" placeholder="Your message (at least 10 characters)" required minlength="10" maxlength="2000"></textarea><button class="btn" type="submit">Send message</button><div id="r" role="status"></div></form></main>
<footer>© 2026 StockFlow Electronics Inventory · Built with Node.js, Express and MySQL</footer><script>document.getElementById("cf").onsubmit=async e=>{e.preventDefault();const r=document.getElementById("r");r.className="";r.textContent="Sending…";try{const x=await fetch("/api/contact",{method:"POST",headers:{"Content-Type":"application/json","X-Requested-With":"stockflow"},body:JSON.stringify({name:n.value,email:document.getElementById("e").value,message:m.value})});const d=await x.json();if(!x.ok)throw new Error(d.error||"Something went wrong.");r.className="msg ok";r.textContent="Thank you! Your message has been sent.";e.target.reset()}catch(err){r.className="msg err";r.textContent=err.message}}</script></body></html>
